<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes — SikshaSaathi</title>
  <meta name="description" content="Your personal study library. Detailed notes, revision sheets, flashcards, mind maps, and AI doubt solving — all in one place.">
  <meta name="theme-color" content="#FAFAFC">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/student.css">
  <link rel="stylesheet" href="css/notes.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
</head>
<body>

  <!-- Interactive ClickSpark Radial Canvas Burst Overlay -->
  <canvas id="click-spark-canvas" class="click-spark-canvas" aria-hidden="true"></canvas>

  <!-- Interactive CursorGrid Intelligence Lattice Canvas Background (Ultra Subtle) -->
  <div id="cursor-grid-container" class="cursor-grid-bg" aria-hidden="true" style="opacity: 0.35;"></div>

  <!-- Ambient Center Radial Glow -->
  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="app-container">
    
    <!-- =========================================================================
         LEFT SIDEBAR (DESKTOP APPLICATION LAYOUT)
         ========================================================================= -->
    <aside class="app-sidebar" aria-label="Application Navigation">
      
      <!-- Brand Logo -->
      <a href="index.html" class="sidebar-logo" aria-label="SikshaSaathi Home">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="17" stroke="#101114" stroke-width="1.5" opacity="0.12"/>
          <path d="M12 24C12 20 24 20 24 16C24 13 21 11 18 11C14 11 12 14 12 14" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="18" cy="11" r="3" fill="#059669"/>
          <circle cx="24" cy="16" r="2.5" fill="#4F46E5"/>
          <circle cx="12" cy="24" r="3" fill="#4F46E5"/>
        </svg>
        <span>Siksha Saathi</span>
      </a>

      <!-- Primary Navigation Links -->
      <nav class="sidebar-nav">
        
        <a href="student.html" class="sidebar-link">
          <svg class="svg-icon sidebar-link-icon" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Dashboard</span>
        </a>

        <a href="student-mentor.html" class="sidebar-link">
          <svg class="svg-icon sidebar-link-icon" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
          <span>AI Mentor</span>
          <span class="sidebar-badge">SOCRATIC</span>
        </a>

        <a href="student-notes.html" class="sidebar-link active" aria-current="page">
          <svg class="svg-icon sidebar-link-icon" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>
          <span>Notes</span>
        </a>

        <a href="student-flashcards.html" class="sidebar-link">
          <svg class="svg-icon sidebar-link-icon" viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V9Z"/><path d="m9 2 3 4 3-4"/></svg>
          <span>Flashcards</span>
          <span class="sidebar-badge">8 DUE</span>
        </a>

        <a href="student-practice.html" class="sidebar-link">
          <svg class="svg-icon sidebar-link-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          <span>Practice</span>
        </a>

        <a href="student-assessments.html" class="sidebar-link">
          <svg class="svg-icon sidebar-link-icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Assessments</span>
        </a>

        <a href="student-revision.html" class="sidebar-link">
          <svg class="svg-icon sidebar-link-icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span>Smart Revision</span>
        </a>

        <a href="student-emergency.html" class="sidebar-link">
          <svg class="svg-icon sidebar-link-icon" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 10 10-12h-9l1-10z"/></svg>
          <span>Emergency Mode</span>
        </a>

        <div class="nav-section-title">LEARNING</div>

        <a href="student-profile.html#tab-genome" class="sidebar-link">
          <svg class="svg-icon sidebar-link-icon" viewBox="0 0 24 24"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
          <span>Progress</span>
        </a>

        <a href="student-profile.html#tab-achievements" class="sidebar-link">
          <svg class="svg-icon sidebar-link-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
          <span>Achievements</span>
        </a>

      </nav>

      <!-- Bottom Profile Area -->
      <div class="sidebar-profile">
        
        <!-- Profile Dropdown Popup -->
        <div id="profile-menu-popup" class="profile-menu-popup" role="menu">
          <a href="student-profile.html" class="profile-menu-item">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile Details</span>
          </a>
          <a href="student-profile.html#tab-genome" class="profile-menu-item">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <span>Learning Genome</span>
          </a>
          <a href="student-profile.html#tab-achievements" class="profile-menu-item">
            <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
            <span>Achievements</span>
          </a>
          <a href="student-profile.html#tab-settings" class="profile-menu-item">
            <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Settings</span>
          </a>
          <hr style="border: none; border-top: 1px solid var(--border-subtle); margin: 4px 0;">
          <a href="index.html" class="profile-menu-item" style="color: var(--rose-accent);">
            <svg class="svg-icon" viewBox="0 0 24 24" style="stroke: var(--rose-accent);"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            <span>Sign Out</span>
          </a>
        </div>

        <button id="profile-menu-btn" class="profile-card-btn" aria-haspopup="true" aria-expanded="false">
          <div class="profile-avatar">AS</div>
          <div style="flex-grow: 1;">
            <div class="profile-name">Scholar</div>
            <div class="profile-role">Class 12 • Science</div>
          </div>
          <span class="profile-dropdown-arrow">▾</span>
        </button>

      </div>

    </aside>

    <!-- =========================================================================
         MAIN CONTENT REGION
         ========================================================================= -->
    <main class="app-main notes-page">
      
      <!-- Top Bar -->
      <header class="main-topbar">
        <div class="topbar-greeting" id="topbar-greeting">
          <h2>Notes</h2>
          <p>Your study material, organized simply.</p>
        </div>

        <!-- Topic Section Topbar Navigation (shown only when viewing any notes topic) -->
        <div class="topbar-chapter-nav" id="topbar-chapter-nav" style="display: none;">
          <button class="notes-topbar-back-btn" id="topbar-back-btn" aria-label="Back to Notes Library">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back to Notes</span>
          </button>
          <div class="topbar-chapter-info">
            <span class="topbar-chapter-subject" id="topbar-chapter-subject">Chemistry</span>
            <span class="topbar-chapter-sep">/</span>
            <span class="topbar-chapter-title" id="topbar-chapter-title">Topic</span>
          </div>
        </div>

        <div class="topbar-actions">
          <button class="topbar-btn" aria-label="Notifications">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notification-dot"></span>
          </button>

          <a href="index.html" class="topbar-btn" title="Back to Landing Page" aria-label="Exit to landing page">
            <svg class="svg-icon" viewBox="0 0 24 24"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
          </a>
        </div>
      </header>

      <!-- Scrollable Main Content -->
      <div class="main-content-scroll" style="padding: 1.5rem 2rem; max-width: 1100px;">
        
        <!-- =====================================================================
             LIBRARY VIEW (default)
             ===================================================================== -->
        <div id="notes-library-view">

          <!-- Search Bar -->
          <div class="notes-search-wrap">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="notes-search-input" id="notes-search-input" placeholder="Search your notes..." aria-label="Search notes">
            <div class="notes-search-results" id="notes-search-results"></div>
          </div>

          <!-- Subject Filter Pills -->
          <div class="notes-subject-pills" id="notes-subject-pills">
            <!-- Dynamically rendered -->
          </div>

          <!-- Chapter Cards -->
          <div id="notes-library-content">
            <div class="notes-loading">Loading notes...</div>
          </div>

        </div>

        <!-- =====================================================================
             CHAPTER VIEW (hidden by default)
             ===================================================================== -->
        <div id="notes-chapter-view" style="display: none;">
          <div id="notes-chapter-content">
            <!-- Dynamically rendered by notes-app.js -->
          </div>
        </div>

      </div>
    </main>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/cursor-grid.js"></script>
  <script src="js/click-spark.js"></script>
  <script src="js/config.js"></script>
  <script src="js/session.js"></script>
  <script src="js/student.js"></script>
  <script src="js/notes-app.js"></script>
  <!-- Universal Mobile Navigation Controller -->
  <script src="js/mobile-nav.js"></script>
</body>
</html>
